# @package _global_

model:
    _target_: pi3.models.pi3_3dgs.Pi3_3DGS
    pos_type: rope100
    decoder_size: large
    load_vggt: false
    freeze_encoder: true
    # use_global_points: false
    train_conf: false
    num_dec_blk_not_to_checkpoint: 999
    ckpt: "outputs/pi3_lowres_free/ckpts/best_model/model.safetensors" # <path-to-your-pretrain-checkpoint>

loss:
    train_loss:
        _target_: pi3.models.loss_3dgs.Pi3LossGS
        # train_conf: false

    test_loss:
        _target_: pi3.models.loss_3dgs.Pi3LossGS
        # train_conf: false

train:
    num_workers: 16
    batch_size: 1              # not use, dynamic batch size
    num_epoch: 2 #80
    iters_per_epoch: 10000 # 800

    print_freq: 40
    base_seed: 666

    model_dtype: bf16
    # dynamic complie
    dynamo_backend: NO  # CUDAGRAPHS  # INDUCTOR  # NO
    dynamic_compile: true

    # Training config
    gradient_accumulation_steps: 4
    clip_grad: 1.0
    clip_loss: 10

    seed: 42
    resume: null
    auto_resume: true
    start_epoch: 0
    global_step: 0
    world_size: 1
    rank: -1
    gpu: -1
    dist_on_itp: false
    find_unused_parameters: true

    # for distributed training
    distributed: false
    dist_url: env://
    dist_backend: "nccl"

    # Optimizer config
    optimizer:
        type: AdamW
        lr: 4e-5
        weight_decay: 5e-2
        betas: [0.9, 0.95]
        verbose: true
        filter_bias_and_bn: true
        fused: True  # 核心加速参数
        encoder_lr: 5e-6

    # lr_scheduler:
    #     type: OneCycleLR
    #     max_lr: ${train.optimizer.lr}
    #     pct_start: 0.0
    #     anneal_strategy: cos
    #     div_factor: 1000.0
    #     final_div_factor: 100.0
    #     total_steps: -1
    # 彻底抛弃坑人的 OneCycleLR
    lr_scheduler:
        type: CosineAnnealingLR
        total_steps: -1    # 12个epoch * 10000步。这里直接写死，最安全！
        eta_min: 1e-7

test:
    num_workers: 16              # 16
    batch_size: 1              # not use, dynamic batch size
    print_freq: 10
    iters_per_test: -1