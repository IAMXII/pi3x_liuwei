# @package _global_

name: 'template'
working_dir: ${work_dir}
random_seed: 1111

log:
  # output_dir: '${work_dir}/outputs/${name}-${now:%Y-%m-%d_%H-%M-%S}'
  output_dir: '${work_dir}/outputs/${name}'
  use_tensorboard: false
  use_wandb: false
  log_images: false
  metric_allowlist:
    - loss
    - loss_*
    - train/loss
    - train/loss_*
    - val/loss
    - val/loss_*
    - train_loss
    - train_loss_*
    - val_loss
    - val_loss_*
    - lr
    - min_lr
    - grad_norm
    - epoch
  project_name: "My_3DGS_Project" # WandB 上的项目名
  exp_name: "run_v1_large_decoder" # 本次实验的名称 (Run Name)
  wandb_entity: null # (可选) WandB 用户名或团队名
  wandb_init_conf:
    name: ${name}
    entity: ethan-predator
    project: ${name}
  summary_interval: 1 # interval of step
  ckpt_interval: 1 # interval of epoch - save every epoch for better recovery
  max_checkpoints: 3 # keep last 3 checkpoints
  # ckpt_dir: '${work_dir}/outputs/${name}-${now:%Y-%m-%d_%H-%M-%S}/ckpts'
  ckpt_dir: '${work_dir}/outputs/${name}/ckpts'

hydra:
  run:
    # dir: ${work_dir}/outputs/${name}-${now:%Y-%m-%d_%H-%M-%S}
    dir: ${work_dir}/outputs/${name}

work_dir: ${hydra:runtime.cwd}
