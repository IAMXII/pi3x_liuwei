# @package _global_

# =========================================================
# 🎛️ 数据集全局控制面板 (True 开启，False 关闭)
# =========================================================
dataset_switches:
    tartanair: false
    scannet: false
    co3dv2: true
    wildrgbd: true
    matrixcity: true
    mapfree: false
    midair: true
    ntu: true
# =========================================================

train_dataset:
    length: 400000         # dummy

    # 这里的权重都会保留，但在代码中可以通过读取 enabled 状态来决定是否使用该权重
    weights: 
        co3dv2: 10000
        wildrgbd: 10000
        matrixcity: 10000
        midair: 10000
        # mapfree: 10000
        ntu: 10000

    TarTanAir:
        _target_: datasets.tartanair_dataset.TarTanAirDataset
        z_far: 80
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.NoTransform
        aug_focal: 0.9
        mode: 'train'

    ScanNet:
        _target_: datasets.scannet_dataset.ScannetDataset
        z_far: 80
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.NoTransform
        aug_focal: 0.9
        mode: 'train'

    co3dv2:
        _target_: datasets.co3dv2_dataset.CO3DV2Dataset
        z_far: 0
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.NoTransform
        aug_focal: 0.9
        mode: 'train'

    wildrgbd:
        _target_: datasets.wildrgbd_dataset.WildRGBDDataset
        z_far: 0
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.NoTransform
        aug_focal: 0.9
        mode: 'train'
    
    matrixcity:
        _target_: datasets.matrixcity_dataset.MatrixCityDataset
        z_far: 0
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.NoTransform
        aug_focal: 0.9
        mode: 'train'

    mapfree:
        _target_: datasets.mapfree_dataset.MapFreeDataset
        z_far: 0
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.NoTransform
        aug_focal: 0.9
        mode: 'train'

    midair:
        _target_: datasets.midair_dataset.MidAirDataset
        z_far: 0
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.NoTransform
        aug_focal: 0.9
        mode: 'train'

    ntu:
        _target_: datasets.ntu_dataset.NTUDataset
        z_far: 0
        frame_num: 8
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.NoTransform
        aug_focal: 0.9
        mode: 'train'

train_dataloader:
    drop_last: True
    shuffle: True

