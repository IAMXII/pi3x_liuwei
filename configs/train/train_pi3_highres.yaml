# @package _global_

trainer: trainers.pi3_trainer.Pi3Trainer

train:
  image_num_range: [2, 16]    # hres - expanded upper bound to test larger multi-view samples
  max_img_per_gpu: 16         # keep aligned with image_num_range for larger-view HSDP runs

  # dynamic resolution and
  random_reslution: true
  aspect_ratio_range: [0.5, 2]
  pixel_count_range: [100000, 255000]
  patch_size: 14
  num_resolution: -1

model:
  ckpt: "outputs/pi3_highres_0425_v6_local_comp/ckpts/best_model/model.safetensors" # <path-to-your-pretrain-checkpoint>

