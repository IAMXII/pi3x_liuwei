# @package _global_

trainer: trainers.pi3_trainer.Pi3Trainer

train:
  image_num_range: [2, 12]    # hres - increased from [2,8] to [8,12] for incremental testing
  max_img_per_gpu: 12           # hres - allows testing clustering effectiveness with varying image counts

  # dynamic resolution and
  random_reslution: true
  aspect_ratio_range: [0.5, 2]
  pixel_count_range: [100000, 255000]
  patch_size: 14
  num_resolution: -1

model:
  ckpt: "outputs/pi3_highres_0410/ckpts/best_model/model.safetensors" # <path-to-your-pretrain-checkpoint>

